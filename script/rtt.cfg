#
# CMSIS-DAP 仅旁路读取 RTT，不复位、不 halt
# STM32F103C8 SRAM: 0x20000000, 20KB
#

reset_config none

gdb_port disabled

init

# 目标已在跑，SWD 可提高到 4MHz
adapter speed 4000

if { [catch { resume }] } {
}

rtt setup 0x20000000 0x5000 "SEGGER RTT"

if { [catch { rtt start }] } {
	echo "RTT: control block not found. Is firmware running?"
} else {
	echo "RTT: control block found"
}

rtt polling_interval 1
rtt server start 9090 0
echo "RTT: 127.0.0.1:9090 channel 0"
