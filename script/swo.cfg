#
# CMSIS-DAP 仅旁路读取 SWO，不复位、不 halt
# 须 SWD（JTAG 下 PB3 是 TDO，不能当 SWO）
# 频率须与目标 swo_init / launch.json swoFrequency 一致：1 MHz
#

reset_config none

gdb_port disabled

init

# 目标已在跑，SWD 可提高到 4MHz
adapter speed 4000

if { [catch { resume }] } {
}

stm32f1x.tpiu configure -protocol uart -output :9091 -traceclk 72000000 -pin-freq 1000000

if { [catch { stm32f1x.tpiu enable }] } {
	echo "SWO: tpiu enable failed. Use SWD, and is swo_init running?"
} else {
	echo "SWO: control started"
}

echo "SWO: 127.0.0.1:9091  1MHz ITM"
